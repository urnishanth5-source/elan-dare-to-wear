name: Fix Shirts Category Label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename category label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/HomeScreen.tsx')
          s = p.read_text()
          s = s.replace('Linen Shirts & Pants', 'Shirts and Pant')
          p.write_text(s)
          PY

      - name: Commit category label update and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-shirts-category.yml
          git add src/components/HomeScreen.tsx .github/workflows/fix-shirts-category.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix Shirts and Pant category label'
          git push
